<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>多功能籃球戰術板 V1.3 FIBA</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111827;color:#fff;overflow:hidden}button,input{font:inherit}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0b1220;border-bottom:1px solid #263244}.title{font-weight:800;white-space:nowrap}.name{min-width:0;flex:1;background:#172033;border:1px solid #334155;color:white;border-radius:10px;padding:9px}.btn{background:#1f2937;border:1px solid #3b475a;color:#fff;border-radius:10px;padding:9px 11px;cursor:pointer}.btn.active{background:#2563eb}.courtwrap{position:relative;flex:1;min-height:0;background:#222;display:flex;justify-content:center;align-items:center;padding:8px}.court{position:relative;width:min(100%,1000px);height:auto;aspect-ratio:28/15;max-height:calc(100dvh - 132px);background:#c9894f;border:4px solid #f7e7c6;overflow:hidden;touch-action:none}.court-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}.court:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 56px)}.mid{position:absolute;left:50%;top:0;bottom:0;border-left:3px solid #f7e7c6}.circle{position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:3px solid #f7e7c6;border-radius:50%;transform:translate(-50%,-50%)}.key{position:absolute;top:50%;width:16%;height:40%;border:3px solid #f7e7c6;transform:translateY(-50%)}.key.l{left:0}.key.r{right:0}.arc{position:absolute;top:50%;width:22%;height:58%;border:3px solid #f7e7c6;border-radius:50%;transform:translateY(-50%)}.arc.l{left:-10%}.arc.r{right:-10%}.hoop{position:absolute;top:50%;width:14px;height:14px;border:3px solid #f7e7c6;border-radius:50%;transform:translateY(-50%)}.hoop.l{left:7%}.hoop.r{right:7%}canvas{position:absolute;z-index:2;inset:0;width:100%;height:100%;touch-action:none}.player{position:absolute;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:3px solid #fff;box-shadow:0 2px 7px #0008;user-select:none;touch-action:none;z-index:4}.home{background:#2563eb}.away{background:#dc2626}.ball{position:absolute;width:28px;height:28px;border-radius:50%;background:#f97316;border:2px solid #111;display:grid;place-items:center;z-index:4;touch-action:none}.tools{min-height:66px;padding:7px;background:#0b1220;display:flex;gap:6px;align-items:center;overflow-x:auto;border-top:1px solid #263244}.tools .btn{white-space:nowrap}.saved{position:fixed;right:10px;top:68px;width:min(320px,88vw);max-height:60vh;overflow:auto;background:#111827;border:1px solid #475569;border-radius:14px;padding:10px;z-index:20;display:none}.saved.show{display:block}.card{display:flex;align-items:center;gap:6px;background:#1f2937;padding:8px;border-radius:9px;margin-top:7px}.card span{flex:1;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#000c;padding:9px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}@media(max-width:650px){.title{display:none}.top{height:52px}.btn{padding:8px 9px}.courtwrap{padding:4px}.tools{min-height:62px}.court{max-height:calc(100dvh - 118px)}}
</style></head><body><div class="app"><div class="top"><div class="title">🏀 多功能籃球戰術板 V1.3 FIBA</div><input id="name" class="name" value="新戰術" aria-label="戰術名稱"><button class="btn" id="half">半場</button><button class="btn" id="library">戰術庫</button><button class="btn" id="save">💾</button></div><div class="courtwrap"><div id="court" class="court"><svg class="court-lines" viewBox="0 0 28 15" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<g fill="none" stroke="#f7e7c6" stroke-width="0.05">
 <rect x="0.025" y="0.025" width="27.95" height="14.95"/>
 <line x1="14" y1="0" x2="14" y2="15"/>
 <circle cx="14" cy="7.5" r="1.8"/>
 <!-- restricted areas: outer edges 2.45 m from endline midpoint -->
 <path d="M0 5.05 H5.8 V9.95 H0"/><path d="M28 5.05 H22.2 V9.95 H28"/>
 <!-- free throw circles; inner half dashed -->
 <path d="M5.8 5.7 A1.8 1.8 0 0 1 5.8 9.3"/>
 <path d="M22.2 5.7 A1.8 1.8 0 0 0 22.2 9.3"/>
 <path d="M5.8 5.7 A1.8 1.8 0 0 0 5.8 9.3" stroke-dasharray="0.2 0.15"/>
 <path d="M22.2 5.7 A1.8 1.8 0 0 1 22.2 9.3" stroke-dasharray="0.2 0.15"/>
 <!-- backboards and rings -->
 <line x1="1.2" y1="6.6" x2="1.2" y2="8.4"/><line x1="26.8" y1="6.6" x2="26.8" y2="8.4"/>
 <circle cx="1.575" cy="7.5" r="0.225"/><circle cx="26.425" cy="7.5" r="0.225"/>
 <!-- 3pt: straight lines 0.90m from sidelines, arc r=6.75 about basket. intersection x≈3.299 -->
 <line x1="0" y1="0.9" x2="3.299" y2="0.9"/><line x1="0" y1="14.1" x2="3.299" y2="14.1"/>
 <path d="M3.299 0.9 A6.75 6.75 0 0 1 3.299 14.1"/>
 <line x1="28" y1="0.9" x2="24.701" y2="0.9"/><line x1="28" y1="14.1" x2="24.701" y2="14.1"/>
 <path d="M24.701 0.9 A6.75 6.75 0 0 0 24.701 14.1"/>
 <!-- no-charge semicircle radius 1.30m -->
 <path d="M1.575 6.2 A1.3 1.3 0 0 1 1.575 8.8"/><path d="M26.425 6.2 A1.3 1.3 0 0 0 26.425 8.8"/>
 <!-- throw-in lines opposite scorer table, 8.325m from endlines -->
 <line x1="8.325" y1="0" x2="8.325" y2="0.15"/><line x1="19.675" y1="0" x2="19.675" y2="0.15"/>
</g></svg><canvas id="canvas"></canvas></div></div><div class="tools"><button class="btn active" data-tool="move">☝️ 移動</button><button class="btn" data-tool="arrow">➜ 跑位</button><button class="btn" data-tool="pass">⇢ 傳球</button><button class="btn" data-tool="screen_pnr">⊥ 持球擋拆</button><button class="btn" data-tool="screen_off">⊥ 無球掩護</button><button class="btn" data-tool="dho">↔ 手遞手 DHO</button><button class="btn" data-tool="draw">✏️ 畫筆</button><button class="btn" data-tool="erase">🧽 擦除</button><button class="btn" id="undo">↶ 復原</button><button class="btn" id="redo">↷ 重做</button><button class="btn" id="reset">重設球員</button><button class="btn" id="clear">🗑 清線</button></div></div><div id="saved" class="saved"><b>戰術庫</b><div id="savedList"></div></div><div id="toast" class="toast"></div><script>
const court=document.getElementById('court'),cv=document.getElementById('canvas'),ctx=cv.getContext('2d');let tool='move',drawing=false,start=null,paths=[],redoStack=[],draft=null,half=false;const courtSvg=document.querySelector('.court-lines');
function resize(){const r=court.getBoundingClientRect(),old={w:cv.width,h:cv.height};cv.width=Math.round(r.width);cv.height=Math.round(r.height);if(old.w&&old.h&&(old.w!==cv.width||old.h!==cv.height)){paths=paths.map(p=>({...p,pts:p.pts.map(q=>({x:q.x*cv.width/old.w,y:q.y*cv.height/old.h}))}));}render()}addEventListener('resize',resize);setTimeout(resize,30);
function render(){ctx.clearRect(0,0,cv.width,cv.height);for(const p of paths) drawPath(p);if(draft)drawPath(draft)}
function drawPath(p){ctx.save();let isPass=p.type==='pass',isScreen=p.type==='screen_pnr'||p.type==='screen_off',isDho=p.type==='dho';ctx.lineWidth=isPass?4:5;ctx.strokeStyle=isPass?'#ffe66d':p.type==='screen_pnr'?'#a7f3d0':p.type==='screen_off'?'#fbcfe8':isDho?'#bfdbfe':'#fff';ctx.fillStyle=ctx.strokeStyle;ctx.setLineDash(isPass?[10,8]:p.type==='screen_off'?[7,7]:[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p.pts[0].x,p.pts[0].y);for(let i=1;i<p.pts.length;i++)ctx.lineTo(p.pts[i].x,p.pts[i].y);ctx.stroke();if(p.type==='arrow'||isPass||isDho){let a=p.pts[p.pts.length-2],b=p.pts[p.pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x);ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-16*Math.cos(ang-.55),b.y-16*Math.sin(ang-.55));ctx.lineTo(b.x-16*Math.cos(ang+.55),b.y-16*Math.sin(ang+.55));ctx.closePath();ctx.fill();if(isDho){ctx.beginPath();ctx.arc(a.x,a.y,7,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.stroke()}}if(isScreen){let a=p.pts[p.pts.length-2],b=p.pts[p.pts.length-1],ang=Math.atan2(b.y-a.y,b.x-a.x),bar=14;ctx.setLineDash([]);ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(b.x+bar*Math.cos(ang+Math.PI/2),b.y+bar*Math.sin(ang+Math.PI/2));ctx.lineTo(b.x-bar*Math.cos(ang+Math.PI/2),b.y-bar*Math.sin(ang+Math.PI/2));ctx.stroke();ctx.font='bold 14px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.type==='screen_pnr'?'P&R':'S',b.x+24*Math.cos(ang),b.y+24*Math.sin(ang))}ctx.restore()}
function pt(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
cv.onpointerdown=e=>{if(tool==='move')return;cv.setPointerCapture(e.pointerId);drawing=true;start=pt(e);draft={type:tool==='erase'?'draw':tool,pts:[start,start]};if(tool==='draw'||tool==='erase')draft.pts=[start]};
cv.onpointermove=e=>{if(!drawing)return;let p=pt(e);if(tool==='draw'||tool==='erase'){if(tool==='erase'){paths=paths.filter(path=>!path.pts.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<25));draft=null}else draft.pts.push(p)}else draft.pts=[start,p];render()};
cv.onpointerup=e=>{if(!drawing)return;drawing=false;if(draft&&draft.pts.length>1){paths.push(draft);redoStack=[]}draft=null;render()};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));cv.style.pointerEvents=tool==='move'?'none':'auto'});cv.style.pointerEvents='none';
function addToken(cls,label,x,y,id){let el=document.createElement('div');el.className=cls;el.textContent=label;el.dataset.id=id;el.style.left=x+'%';el.style.top=y+'%';court.appendChild(el);drag(el);return el}
function drag(el){let ox,oy;el.onpointerdown=e=>{if(tool!=='move')return;e.preventDefault();el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top};el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;let r=court.getBoundingClientRect(),x=e.clientX-r.left-ox,y=e.clientY-r.top-oy;x=Math.max(0,Math.min(r.width-el.offsetWidth,x));y=Math.max(0,Math.min(r.height-el.offsetHeight,y));el.style.left=x/r.width*100+'%';el.style.top=y/r.height*100+'%'}}
function resetPlayers(){court.querySelectorAll('.player,.ball').forEach(x=>x.remove());[1,2,3,4,5].forEach((n,i)=>addToken('player home',n,20+(i%2)*12,16+i*15,'h'+n));[1,2,3,4,5].forEach((n,i)=>addToken('player away',n,68+(i%2)*10,16+i*15,'a'+n));addToken('ball','●',48,46,'ball')}resetPlayers();
document.getElementById('undo').onclick=()=>{if(paths.length){redoStack.push(paths.pop());render()}};document.getElementById('redo').onclick=()=>{if(redoStack.length){paths.push(redoStack.pop());render()}};document.getElementById('clear').onclick=()=>{paths=[];redoStack=[];render()};document.getElementById('reset').onclick=resetPlayers;
document.getElementById('half').onclick=()=>{half=!half;courtSvg.setAttribute('viewBox',half?'0 0 14 15':'0 0 28 15');court.style.aspectRatio=half?'14/15':'28/15';document.getElementById('half').textContent=half?'全場':'半場';setTimeout(resize,20);toast(half?'半場模式':'全場模式')};
function snapshot(){return{name:document.getElementById('name').value||'未命名',paths,half,tokens:[...court.querySelectorAll('.player,.ball')].map(e=>({id:e.dataset.id,cls:e.className,text:e.textContent,left:e.style.left,top:e.style.top}))}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
function saves(){return JSON.parse(localStorage.getItem('tacticsV13')||localStorage.getItem('tacticsV1')||'[]')}function write(a){localStorage.setItem('tacticsV13',JSON.stringify(a))}
document.getElementById('save').onclick=()=>{let a=saves(),s=snapshot();let i=a.findIndex(x=>x.name===s.name);if(i>=0)a[i]=s;else a.unshift(s);write(a);renderSaved();toast('已儲存')};
function load(s){document.getElementById('name').value=s.name;paths=s.paths||[];half=!!s.half;document.getElementById('half').click();document.getElementById('half').click();court.querySelectorAll('.player,.ball').forEach(x=>x.remove());(s.tokens||[]).forEach(t=>{let e=addToken(t.cls,t.text,0,0,t.id);e.style.left=t.left;e.style.top=t.top});render();document.getElementById('saved').classList.remove('show')}
function renderSaved(){let box=document.getElementById('savedList');box.innerHTML='';let a=saves();if(!a.length){box.innerHTML='<p style="opacity:.65">尚未儲存戰術</p>';return}a.forEach((s,i)=>{let d=document.createElement('div');d.className='card';let sp=document.createElement('span');sp.textContent=s.name;let open=document.createElement('button');open.className='btn';open.textContent='開啟';open.onclick=()=>load(s);let del=document.createElement('button');del.className='btn';del.textContent='刪除';del.onclick=()=>{let x=saves();x.splice(i,1);write(x);renderSaved()};d.append(sp,open,del);box.appendChild(d)})}renderSaved();document.getElementById('library').onclick=()=>document.getElementById('saved').classList.toggle('show');
</script></body></html>
